<!-- templates/upload_photo.html -->
{% load image_constraints %}
{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Upload Farmer Photo</title>
</head>
<body>
    <h1>Upload Farmer Photo</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        {% image_upload_help 'gallery' %}
        <button type="submit">Upload</button>
    </form>
    <script src="{% static 'js/image_upload_guard.js' %}"></script>
</body>
</html>
